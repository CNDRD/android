name: Fork UX APK and tests

on:
  push:
    branches: [feature/upload-feedback-grid-density]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.source }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, feature]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source == 'baseline' && '3d73ce06f4926c21013650a4f98bc5d37fff2ad1' || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore permanent personal signing key
        if: matrix.source == 'feature'
        id: signing
        env:
          OC_QA_SIGNING_JSON: ${{ secrets.OC_QA_SIGNING_JSON }}
        run: python3 .github/scripts/prepare-qa-signing.py
      - name: Build installable QA debug APK
        if: matrix.source == 'baseline' || steps.signing.outputs.ready == 'true'
        run: ./gradlew :opencloudApp:assembleQaDebug -PversionCode=$((1000 + GITHUB_RUN_NUMBER))
      - name: Verify permanent APK signing certificate
        if: matrix.source == 'feature' && steps.signing.outputs.ready == 'true'
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import re
          import subprocess
          apks = list(Path('opencloudApp/build/outputs/apk/qa/debug').glob('*.apk'))
          if len(apks) != 1:
              raise SystemExit('Expected exactly one personal APK')
          signer = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/apksigner'
          result = subprocess.run([str(signer), 'verify', '--print-certs', str(apks[0])], capture_output=True, text=True, check=True)
          digest = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', result.stdout)
          expected = Path('.github/qa-signing-certificate.sha256').read_text().strip()
          if digest is None or digest.group(1).lower() != expected:
              raise SystemExit('APK signing certificate mismatch; refusing to publish')
          print('APK signature verified against the permanent certificate')
          PYTHON
      - name: Test startup layout and upload feedback
        if: matrix.source == 'feature'
        run: ./gradlew :opencloudApp:testQaDebugUnitTest --tests 'eu.opencloud.android.presentation.transfers.UploadFeedbackTrackerTest' --tests 'eu.opencloud.android.presentation.startup.*' --tests 'eu.opencloud.android.presentation.material3.Material3BrowserTest'
      - uses: actions/upload-artifact@v4
        if: matrix.source == 'baseline' || steps.signing.outputs.ready == 'true'
        with:
          name: opencloud-${{ matrix.source }}-qa-debug
          path: opencloudApp/build/outputs/apk/qa/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.source == 'feature'
        with:
          name: upload-feedback-test-results
          path: opencloudApp/build/reports/tests/
      - name: Remove temporary private keystore
        if: always() && matrix.source == 'feature'
        run: rm -f "$RUNNER_TEMP/opencloud-personal-signing.p12"
